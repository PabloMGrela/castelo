# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name logopediacastelo.com www.logopediacastelo.com;
    return 301 https://logopediacastelo.com$request_uri;
}

# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.logopediacastelo.com;

    ssl_certificate     /etc/ssl/certs/logopediacastelo.com.pem;
    ssl_certificate_key /etc/ssl/private/logopediacastelo.com.key;

    return 301 https://logopediacastelo.com$request_uri;
}

# Main site (HTTPS)
server {
    listen 443 ssl;
    server_name logopediacastelo.com;

    ssl_certificate     /etc/ssl/certs/logopediacastelo.com.pem;
    ssl_certificate_key /etc/ssl/private/logopediacastelo.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://www.doctoralia.es; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://maps.googleapis.com; frame-src https://www.google.com https://www.doctoralia.es; font-src 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Handle Next.js static export routing
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Cache fingerprinted assets forever (Next.js uses content hashes)
    location ~* ^/_next/static/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache other static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|wasm|ttf|otf|bin|json)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML: short cache to allow content updates
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 404 /404.html;
}
